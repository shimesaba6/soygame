<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スパイゲーム 監視モニター</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #222;
      color: #fff;
      padding-top: 50px;
      transition: background-color 0.2s;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #007bff;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button:active {
      transform: translateY(2px);
    }
    #status {
      margin-top: 30px;
      font-size: 20px;
      color: #aaa;
    }
    /* アラート時のド派手な画面切り替え用 */
    .alert-mode {
      background-color: #aa0000 !important;
      color: #fff !important;
      font-size: 40px !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>スパイゲーム 監視モニター</h1>
  <button id="connectBtn">Arduinoに接続する</button>
  <div id="status">未接続</div>

  <!-- 用意した音声ファイルを読み込む設定 -->
  <!-- preload="auto" で事前に読み込み、遅延を防ぐ -->
  <audio id="outSound" src="out.mp3" preload="auto"></audio>

  <script>
    let usbDevice;
    let isReading = false;

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        // CH340チップ (Vendor ID: 0x1A86) を指定してUSBデバイスを要求
        usbDevice = await navigator.usb.requestDevice({ 
          filters: [{ vendorId: 0x1A86 }] 
        });
        
        await usbDevice.open();
        
        // Androidで既に設定済みの場合のエラーを回避
        if (usbDevice.configuration === null) {
          await usbDevice.selectConfiguration(1);
        }
        await usbDevice.claimInterface(0);

        // ブラウザの仕様上、初回クリック時に音声を「空再生」して再生許可を得ておく
        const audioElement = document.getElementById('outSound');
        audioElement.play().then(() => {
          audioElement.pause();
          audioElement.currentTime = 0;
        }).catch(err => console.log("音声再生の初期化に失敗しました", err));

        // スマホのUSB認識ラグを吸収するため少し待機
        await new Promise(r => setTimeout(r, 200));

        // 通信設定（エラーが出ても無視して次に進む関数）
        const sendInit = async (req, val, idx) => {
          try {
            await usbDevice.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: req, value: val, index: idx });
          } catch(e) {
            console.warn(`設定コマンド ${req} がOSにブロックされましたがスキップします:`, e);
          }
        };

        // CH340の初期化と9600bps設定
        await sendInit(0x5F, 0x0000, 0x0000);
        await sendInit(0xA1, 0x0000, 0x0000);
        await sendInit(0x9A, 0x1312, 0xB282); 
        await sendInit(0xA4, 0x00FF, 0x0000);

        document.getElementById('status').innerText = "接続完了！監視システム稼働中...";
        document.getElementById('connectBtn').style.display = 'none';
        isReading = true;

        // データ受信ループの開始
        readLoop(audioElement);

      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "接続エラー: " + error.name + "\n" + error.message;
      }
    });

    async function readLoop(audioElement) {
      let buffer = "";
      const endpoints = usbDevice.configuration.interfaces[0].alternate.endpoints;
      const inEndpoint = endpoints.find(e => e.direction === 'in');
      
      if (!inEndpoint) {
        document.getElementById('status').innerText = "エラー: 受信エンドポイントが見つかりません";
        return;
      }

      const decoder = new TextDecoder();
      
      while (isReading && usbDevice) {
        try {
          const result = await usbDevice.transferIn(inEndpoint.endpointNumber, 64);
          
          if (result.status === 'ok') {
            buffer += decoder.decode(result.data);
            let lines = buffer.split('\n');
            buffer = lines.pop(); 
            
            for (let line of lines) {
              // Arduino側から "ALERT" が送られてきたら発動
              if (line.includes("ALERT")) {
                const statusDiv = document.getElementById('status');
                statusDiv.innerText = "⚠️ 侵入者検知！アウト！ ⚠️";
                document.body.className = "alert-mode";
                
                // BGMを最初から再生
                audioElement.currentTime = 0; 
                audioElement.play();
                
                // 3秒後に通常画面に戻す（BGMは鳴り続ける）
                setTimeout(() => {
                  statusDiv.innerText = "監視システム稼働中...";
                  document.body.className = "";
                }, 3000);
              }
            }
          }
        } catch (error) {
          console.error("通信エラー:", error);
          document.getElementById('status').innerText = "通信が切断されました";
          break; 
        }
      }
    }
  </script>
</body>
</html>
