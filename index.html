<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スパイゲーム 監視モニター</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #222;
      color: #fff;
      padding-top: 50px;
      transition: background-color 0.2s;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #007bff;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button:active {
      transform: translateY(2px);
    }
    #status {
      margin-top: 30px;
      font-size: 35px;
      font-weight: bold;
      color: #aaa;
    }
    
    /* 🔵 動いてよい時（青） */
    .safe-mode {
      background-color: #0044aa !important;
      color: #fff !important;
    }
    /* 🟡 もうすぐ止まれ（黄色/オレンジの点滅） */
    .warn-mode {
      background-color: #aa6600 !important;
      color: #fff !important;
      animation: blink-warn 0.5s infinite alternate;
    }
    /* 🔴 止まれ・監視中（暗い赤） */
    .stop-mode {
      background-color: #330000 !important;
      color: #ffcccc !important;
    }
    /* ⚠️ アラート時（明るい赤） */
    .alert-mode {
      background-color: #ff0000 !important;
      color: #fff !important;
      font-size: 45px !important;
    }

    /* 点滅アニメーションの定義 */
    @keyframes blink-warn {
      0% { background-color: #aa6600; }
      100% { background-color: #553300; }
    }
  </style>
</head>
<body>

  <h1>スパイゲーム 監視モニター</h1>
  <button id="connectBtn">Arduinoに接続する</button>
  <div id="status">未接続</div>

  <audio id="outSound" src="out.mp3" preload="auto"></audio>

  <script>
    let usbDevice;
    let isReading = false;

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        usbDevice = await navigator.usb.requestDevice({ 
          filters: [{ vendorId: 0x1A86 }] 
        });
        
        await usbDevice.open();
        
        if (usbDevice.configuration === null) {
          await usbDevice.selectConfiguration(1);
        }
        await usbDevice.claimInterface(0);

        const audioElement = document.getElementById('outSound');
        audioElement.play().then(() => {
          audioElement.pause();
          audioElement.currentTime = 0;
        }).catch(err => console.log("音声再生の初期化に失敗しました", err));

        await new Promise(r => setTimeout(r, 200));

        const sendInit = async (req, val, idx) => {
          try {
            await usbDevice.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: req, value: val, index: idx });
          } catch(e) {
            console.warn(`設定スキップ:`, e);
          }
        };

        await sendInit(0x5F, 0x0000, 0x0000);
        await sendInit(0xA1, 0x0000, 0x0000);
        await sendInit(0x9A, 0x1312, 0xB282); 
        await sendInit(0xA4, 0x00FF, 0x0000);

        document.getElementById('status').innerText = "接続完了！システム待機中...";
        document.getElementById('connectBtn').style.display = 'none';
        isReading = true;

        readLoop(audioElement);

      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "接続エラー: " + error.name + "\n" + error.message;
      }
    });

    async function readLoop(audioElement) {
      let buffer = "";
      const endpoints = usbDevice.configuration.interfaces[0].alternate.endpoints;
      const inEndpoint = endpoints.find(e => e.direction === 'in');
      
      if (!inEndpoint) {
        document.getElementById('status').innerText = "エラー: 受信エンドポイントが見つかりません";
        return;
      }

      const decoder = new TextDecoder();
      const statusDiv = document.getElementById('status');
      
      while (isReading && usbDevice) {
        try {
          const result = await usbDevice.transferIn(inEndpoint.endpointNumber, 64);
          
          if (result.status === 'ok') {
            buffer += decoder.decode(result.data);
            let lines = buffer.split('\n');
            buffer = lines.pop(); 
            
            for (let line of lines) {
              let data = line.trim();
              
              // Arduinoからの文字に応じて画面の状態を切り替える
              if (data.includes("SAFE")) {
                statusDiv.innerText = "🔵 動いてよし！ 🔵";
                document.body.className = "safe-mode";
              } 
              else if (data.includes("WARN")) {
                statusDiv.innerText = "🟡 止まる準備をしろ！ 🟡";
                document.body.className = "warn-mode";
              }
              else if (data.includes("STOP")) {
                statusDiv.innerText = "🔴 監視中...動くな！ 🔴";
                document.body.className = "stop-mode";
              }
              else if (data.includes("ALERT")) {
                statusDiv.innerText = "⚠️ 侵入者検知！アウト！ ⚠️";
                document.body.className = "alert-mode";
                
                audioElement.currentTime = 0; 
                audioElement.play();
                
                setTimeout(() => {
                  statusDiv.innerText = "🔴 監視中...動くな！ 🔴";
                  document.body.className = "stop-mode";
                }, 3000);
              }
            }
          }
        } catch (error) {
          console.error("通信エラー:", error);
          document.getElementById('status').innerText = "通信が切断されました";
          break; 
        }
      }
    }
  </script>
</body>
</html>
